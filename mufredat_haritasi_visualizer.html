<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Euler 998 Days — İnteraktif Müfredat Haritası</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #1e293b;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand h1 {
      font-size: 1.15rem;
      font-weight: 700;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      padding: 3px 10px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .search-box {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      width: 220px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box:focus {
      border-color: #6366f1;
    }
    .filter-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn.active, .filter-btn:hover {
      background: #312e81;
      border-color: #6366f1;
      color: #e0e7ff;
    }
    main {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at 50% 50%, #111827 0%, #070a12 100%);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }
    .tooltip {
      position: absolute;
      pointer-events: none;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 0.82rem;
      color: #f1f5f9;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      max-width: 320px;
      opacity: 0;
      transition: opacity 0.15s ease-out;
      z-index: 20;
    }
    .tooltip.visible {
      opacity: 1;
    }
    .tooltip-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .tooltip-title {
      font-weight: 700;
      font-size: 0.92rem;
      color: #38bdf8;
    }
    .tooltip-status {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }
    .status-solved {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .status-ready {
      background: rgba(148, 163, 184, 0.15);
      color: #94a3b8;
      border: 1px solid rgba(148, 163, 184, 0.3);
    }
    .tooltip-field {
      margin-top: 4px;
      color: #cbd5e1;
    }
    .tooltip-field span {
      color: #94a3b8;
      font-size: 0.75rem;
    }
    .legend {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid #1e293b;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.78rem;
      display: flex;
      gap: 16px;
      z-index: 10;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>🧮 Project Euler 998 Days Challenge</h1>
      <span class="badge" id="stats-badge">Çözülen: 998 / 998 (100%)</span>
    </div>
    <div class="controls">
      <input type="text" class="search-box" id="search-input" placeholder="Gün, no veya konu ara...">
      <button class="filter-btn active" data-filter="all">Tümü (998)</button>
      <button class="filter-btn" data-filter="solved">Çözülenler (998)</button>
      <button class="filter-btn" data-filter="number_theory">Sayılar Teorisi</button>
      <button class="filter-btn" data-filter="dp">Dinamik Prog.</button>
    </div>
  </header>

  <main>
    <canvas id="canvas"></canvas>
    <div class="tooltip" id="tooltip"></div>
    <div class="legend">
      <div class="legend-item">
        <div class="legend-dot" style="background: #10b981; box-shadow: 0 0 8px #10b981;"></div>
        <span>Doğrulanmış Çözüm (Gün 1-998 / %100)</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background: #3b82f6; box-shadow: 0 0 8px #3b82f6;"></div>
        <span>Tüm Müfredat Tamamlandı 🎓</span>
      </div>
    </div>
  </main>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const tooltip = document.getElementById("tooltip");
    const searchInput = document.getElementById("search-input");
    const filterBtns = document.querySelectorAll(".filter-btn");

    let width, height;
    let nodes = [];
    let hoveredNode = null;
    let activeFilter = "all";
    let searchQuery = "";

    // Kamera / Zoom & Pan
    let camera = {
      x: 0,
      y: 0,
      zoom: 1,
      isDragging: false,
      startX: 0,
      startY: 0
    };

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight - 56;
      draw();
    }
    window.addEventListener("resize", resize);

    // 998 Düğümü Grid Layout olarak yerleştir
    function initNodes(haritaData) {
      const cols = 34; // ~34 sütun x 30 satır = 1020 hücre
      const spacing = 38;
      const startX = -(cols * spacing) / 2;
      const startY = -(30 * spacing) / 2;

      nodes = haritaData.map((item, index) => {
        const col = index % cols;
        const row = Math.floor(index / cols);
        return {
          ...item,
          x: startX + col * spacing,
          y: startY + row * spacing,
          radius: 12,
          isSolved: true,
          color: "#10b981"
        };
      });

      // Kamerayı merkeze al
      camera.x = width / 2;
      camera.y = height / 2;
      camera.zoom = Math.min(width / 1400, height / 1200, 1.0);
    }

    // Canvas Çizimi
    function draw() {
      ctx.clearRect(0, 0, width, height);

      ctx.save();
      ctx.translate(camera.x, camera.y);
      ctx.scale(camera.zoom, camera.zoom);

      // Izgara arka plan çizgileri
      ctx.strokeStyle = "rgba(30, 41, 59, 0.4)";
      ctx.lineWidth = 1 / camera.zoom;
      const gridSize = 100;
      for (let x = -2000; x <= 2000; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, -2000);
        ctx.lineTo(x, 2000);
        ctx.stroke();
      }
      for (let y = -2000; y <= 2000; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(-2000, y);
        ctx.lineTo(2000, y);
        ctx.stroke();
      }

      // Düğümleri çiz
      for (let node of nodes) {
        let isVisible = true;
        if (activeFilter === "solved" && !node.isSolved) isVisible = false;
        if (activeFilter === "number_theory" && !node.topics.primary.includes("Sayılar")) isVisible = false;
        if (activeFilter === "dp" && !node.topics.primary.includes("Dinamik")) isVisible = false;

        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          const matchDay = node.day.toString().includes(q);
          const matchTitle = node.title.toLowerCase().includes(q);
          const matchTopic = node.topics.primary.toLowerCase().includes(q);
          if (!matchDay && !matchTitle && !matchTopic) isVisible = false;
        }

        const isHovered = (hoveredNode === node);

        ctx.beginPath();
        ctx.arc(node.x, node.y, isHovered ? node.radius + 3 : node.radius, 0, Math.PI * 2);

        if (node.isSolved) {
          ctx.fillStyle = isVisible ? "#10b981" : "rgba(16, 185, 129, 0.15)";
          if (isVisible) {
            ctx.shadowColor = isHovered ? "#34d399" : "#10b981";
            ctx.shadowBlur = isHovered ? 16 : 8;
          }
        } else {
          ctx.fillStyle = isVisible ? "#1e293b" : "rgba(30, 41, 59, 0.2)";
          ctx.shadowBlur = 0;
        }

        ctx.fill();
        ctx.shadowBlur = 0; // reset shadow

        // Kenarlık
        ctx.strokeStyle = node.isSolved ? "#34d399" : "#475569";
        ctx.lineWidth = isHovered ? 2.5 : 1;
        ctx.stroke();

        // Metin (Gün numarası)
        ctx.fillStyle = node.isSolved ? "#ffffff" : "#64748b";
        ctx.font = `${isHovered ? "bold 9px" : "8px"} sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(node.day, node.x, node.y);
      }

      ctx.restore();
    }

    // Fare etkileşimleri (Zoom, Pan, Hover)
    canvas.addEventListener("mousedown", (e) => {
      camera.isDragging = true;
      camera.startX = e.clientX - camera.x;
      camera.startY = e.clientY - camera.y;
    });

    window.addEventListener("mouseup", () => {
      camera.isDragging = false;
    });

    canvas.addEventListener("mousemove", (e) => {
      if (camera.isDragging) {
        camera.x = e.clientX - camera.startX;
        camera.y = e.clientY - camera.startY;
        draw();
        return;
      }

      // Dünya koordinatlarına çevir
      const mouseX = (e.clientX - camera.x) / camera.zoom;
      const mouseY = (e.clientY - 56 - camera.y) / camera.zoom;

      let found = null;
      for (let node of nodes) {
        const dx = node.x - mouseX;
        const dy = node.y - mouseY;
        if (dx * dx + dy * dy <= node.radius * node.radius) {
          found = node;
          break;
        }
      }

      if (found !== hoveredNode) {
        hoveredNode = found;
        draw();

        if (hoveredNode) {
          showTooltip(hoveredNode, e.clientX, e.clientY);
        } else {
          tooltip.classList.remove("visible");
        }
      } else if (hoveredNode) {
        tooltip.style.left = `${e.clientX + 14}px`;
        tooltip.style.top = `${e.clientY + 14}px`;
      }
    });

    canvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.12 : 0.88;
      const newZoom = Math.max(0.2, Math.min(3.5, camera.zoom * zoomFactor));

      const mouseX = e.clientX - camera.x;
      const mouseY = e.clientY - 56 - camera.y;

      camera.x -= mouseX * (zoomFactor - 1);
      camera.y -= mouseY * (zoomFactor - 1);
      camera.zoom = newZoom;

      draw();
    });

    function showTooltip(node, mouseX, mouseY) {
      tooltip.innerHTML = `
        <div class="tooltip-header">
          <span class="tooltip-title">Gün ${node.day.toString().padStart(3, '0')} (Euler #${node.project_euler_id})</span>
          <span class="tooltip-status ${node.isSolved ? 'status-solved' : 'status-ready'}">
            ${node.isSolved ? '✓ Çözüldü' : '⏳ Hazır'}
          </span>
        </div>
        <div style="font-weight: 600; color: #f8fafc; margin-bottom: 6px;">${node.title}</div>
        <div class="tooltip-field"><span>Ana Konu:</span> ${node.topics.primary}</div>
        <div class="tooltip-field"><span>Zorluk:</span> ${node.difficulty}</div>
        <div class="tooltip-field"><span>Zaman:</span> <code>${node.time_complexity.optimized}</code></div>
      `;
      tooltip.style.left = `${mouseX + 14}px`;
      tooltip.style.top = `${mouseY + 14}px`;
      tooltip.classList.add("visible");
    }

    // Filtre ve Arama Dinleyicileri
    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value.trim();
      draw();
    });

    filterBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        filterBtns.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeFilter = btn.dataset.filter;
        draw();
      });
    });

    // Veriyi Yükle ve Başlat
    fetch("mufredat_haritasi.json")
      .then(res => res.json())
      .then(data => {
        initNodes(data);
        resize();
      })
      .catch(err => {
        console.error("Veri yüklenemedi:", err);
      });
  </script>
</body>
</html>
